<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="880" viewBox="0 0 1260 880" role="img" aria-label="Career-Next 当前 Node / Chrome 产品架构"><title>Career-Next 当前 Node / Chrome 产品架构</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8a958b"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f4"/><g font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"><text x="48" y="61" font-size="34" fill="#172b20" font-weight="600">Career 是怎么工作的</text><text x="48" y="99" font-size="19" fill="#5f6b61" font-weight="400">你在界面里操作；本机后台保存正式资料；需要外部服务时，再确认发送。</text><rect x="34" y="130" width="812" height="670" rx="24" fill="#eef2e9" stroke="#d8e1d2"/><text x="58" y="163" font-size="17" fill="#607565" font-weight="600">你的电脑</text><rect x="58" y="185" width="764" height="108" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="82" y="222" font-size="24" fill="#172b20" font-weight="600">Chrome 界面</text><text x="82" y="255" font-size="21" fill="#171a18" font-weight="400">Wiki  /  机会  /  项目  /  任职</text><text x="82" y="280" font-size="16" fill="#5f6b61" font-weight="400">React 负责展示、输入与编辑；Career.app 启动本机 Node 后台。</text><path d="M440 294 V330" fill="none" stroke="#8a958b" stroke-width="2"  marker-end="url(#arrow)"/><text x="460" y="320" font-size="16" fill="#607565" font-weight="400">查询 / 保存命令（Contract 校验）</text><rect x="58" y="336" width="764" height="260" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="82" y="373" font-size="24" fill="#172b20" font-weight="600">Node 本机后台</text><text x="82" y="404" font-size="16" fill="#5f6b61" font-weight="400">每类资料由自己的业务模块管理，跨模块通过公开接口协作。</text><rect x="82" y="425" width="400" height="143" rx="12" fill="#f7f8f4" stroke="#dce2d8"/><text x="100" y="454" font-size="21" fill="#172b20" font-weight="600">机会</text><text x="100" y="484" font-size="18" fill="#171a18" font-weight="400">简历  ·  情报  ·  沟通  ·  投递</text><text x="100" y="515" font-size="18" fill="#171a18" font-weight="400">面试  ·  Offer</text><text x="100" y="549" font-size="16" fill="#607565" font-weight="400">当前稿、实际投递材料分别保存</text><rect x="502" y="425" width="294" height="143" rx="12" fill="#f7f8f4" stroke="#dce2d8"/><text x="520" y="457" font-size="20" fill="#172b20" font-weight="600">Wiki  /  项目  /  任职</text><text x="520" y="491" font-size="18" fill="#171a18" font-weight="400">基础资料  /  原始材料</text><text x="520" y="527" font-size="16" fill="#607565" font-weight="400">来源、关系与各自的历史</text><path d="M440 597 V640" fill="none" stroke="#8a958b" stroke-width="2"  marker-end="url(#arrow)"/><text x="460" y="624" font-size="16" fill="#607565" font-weight="400">唯一写入队列 · 保存回执</text><rect x="58" y="647" width="370" height="123" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="80" y="689" font-size="25" fill="#172b20" font-weight="600">SQLite</text><text x="80" y="723" font-size="18" fill="#171a18" font-weight="400">正文、关系、状态与操作记录</text><text x="80" y="749" font-size="16" fill="#607565" font-weight="400">正式资料保存在本机</text><rect x="448" y="647" width="374" height="123" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="470" y="689" font-size="25" fill="#172b20" font-weight="600">本地文件</text><text x="470" y="723" font-size="18" fill="#171a18" font-weight="400">原始材料与冻结 PDF</text><text x="470" y="749" font-size="16" fill="#607565" font-weight="400">版本保留当时内容；备份与恢复</text><rect x="880" y="185" width="348" height="411" rx="24" fill="#fffdf6" stroke="#e5debf"/><text x="906" y="225" font-size="24" fill="#172b20" font-weight="600">按需使用外部能力</text><text x="906" y="261" font-size="24" fill="#706843" font-weight="600">AI / Search</text><text x="906" y="295" font-size="18" fill="#171a18" font-weight="400">DeepSeek：整理情报</text><text x="906" y="325" font-size="18" fill="#171a18" font-weight="400">Tavily：搜索线索</text><rect x="902" y="348" width="304" height="78" rx="12" fill="#f2efdf" stroke="#e5debf"/><text x="918" y="379" font-size="18" fill="#171a18" font-weight="400">选材料 → 看完整外发预览</text><text x="918" y="409" font-size="17" fill="#171a18" font-weight="400">明确授权后，才发送本次请求</text><text x="906" y="464" font-size="18" fill="#171a18" font-weight="400">返回的建议 → 你决定是否采纳</text><text x="906" y="497" font-size="17" fill="#5f6b61" font-weight="400">采纳后，由对应业务模块保存</text><text x="906" y="550" font-size="17" fill="#171a18" font-weight="400">飞书：只读发现与有限预览</text><text x="906" y="576" font-size="16" fill="#5f6b61" font-weight="400">导入仍按预览与确认流程推进</text><path d="M822 390 H880" fill="none" stroke="#8a958b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M880 495 H826" fill="none" stroke="#8a958b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="880" y="647" width="348" height="123" rx="18" fill="#ffffff" stroke="#dce2d8"/><text x="906" y="685" font-size="23" fill="#172b20" font-weight="600">macOS 窄系统能力</text><text x="906" y="719" font-size="18" fill="#171a18" font-weight="400">Keychain 保存密钥</text><text x="906" y="749" font-size="16" fill="#5f6b61" font-weight="400">固定 Chromium 打印引擎生成 PDF</text><text x="48" y="844" font-size="17" fill="#607565" font-weight="400">本机连接：127.0.0.1  ·  正式运行采用 Node / Chrome  ·  AI 不会自动投递或接受 Offer</text></g></svg>
