<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-label="Career-Next：长期职业工作台"><title>Career-Next：长期职业工作台</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8a958b"/></marker></defs><rect width="100%" height="100%" fill="#f7f8f4"/><g font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif"><text x="66" y="68" font-size="17" fill="#607565" font-weight="600">CAREER / YOUR NEXT CHAPTER</text><text x="66" y="148" font-size="58" fill="#172b20" font-weight="600">把每一次机会，</text><text x="66" y="222" font-size="58" fill="#172b20" font-weight="600">变成下一次的底气。</text><text x="68" y="280" font-size="24" fill="#5f6b61" font-weight="400">找工作 · 做项目 · 记经验</text><text x="68" y="321" font-size="24" fill="#5f6b61" font-weight="400">一个保存在自己电脑上的长期职业工作台。</text><rect x="932" y="64" width="292" height="280" rx="24" fill="#e8eee3" stroke="#dce5d7"/><text x="963" y="114" font-size="32" fill="#172b20" font-weight="600">Career-Next</text><text x="963" y="170" font-size="24" fill="#171a18" font-weight="400">资料留在本机</text><text x="963" y="211" font-size="24" fill="#171a18" font-weight="400">AI 建议由你决定</text><text x="963" y="252" font-size="24" fill="#171a18" font-weight="400">历史保留当时版本</text><text x="963" y="305" font-size="13" fill="#607565" font-weight="600">LOCAL FIRST · HUMAN DECIDES</text><rect x="66" y="388" width="276" height="150" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="88" y="424" font-size="15" fill="#829186" font-weight="600">01</text><text x="88" y="470" font-size="28" fill="#172b20" font-weight="600">机会</text><text x="88" y="507" font-size="17" fill="#5f6b61" font-weight="400">围绕一个岗位，把准备串起来</text><rect x="360" y="388" width="276" height="150" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="382" y="424" font-size="15" fill="#829186" font-weight="600">02</text><text x="382" y="470" font-size="28" fill="#172b20" font-weight="600">项目</text><text x="382" y="507" font-size="17" fill="#5f6b61" font-weight="400">把实际做过的事，记录下来</text><rect x="654" y="388" width="276" height="150" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="676" y="424" font-size="15" fill="#829186" font-weight="600">03</text><text x="676" y="470" font-size="28" fill="#172b20" font-weight="600">任职</text><text x="676" y="507" font-size="17" fill="#5f6b61" font-weight="400">记住每段工作与协作关系</text><rect x="948" y="388" width="276" height="150" rx="18" fill="#ffffff" stroke="#e2e4df"/><text x="970" y="424" font-size="15" fill="#829186" font-weight="600">04</text><text x="970" y="470" font-size="28" fill="#172b20" font-weight="600">Wiki</text><text x="970" y="507" font-size="17" fill="#5f6b61" font-weight="400">把经验整理成以后能用的知识</text><text x="66" y="584" font-size="20" fill="#607565" font-weight="400">求职只是其中一段。你的积累，可以一直继续。</text></g></svg>
